<svg xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        viewBox="0 0 40 40"
        fill="none">
    <!-- Rounded IDE badge background -->
    <rect width="40"
            height="40"
            rx="8"
            fill="#1E1F22"/>
    <rect x="1.5"
            y="1.5"
            width="37"
            height="37"
            rx="6.5"
            stroke="#2B2D30"
            stroke-width="1"/>

    <!-- 'L' #1 (Shifted Left) -->
    <path d="M6 13V27H12"
            stroke="#35D073"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>

    <!-- 'S' (Centered with wider breathing room) -->
    <path d="M24 16C24 14.2 22.2 13 20 13C17.8 13 16 14.2 16 16C16 20 24 19.5 24 24C24 26 22 27 20 27C17.5 27 16 25.4 16 23.5"
            stroke="#2DD4BF"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>

    <!-- 'L' #2 (Shifted Right) -->
    <path d="M28 13V27H34"
            stroke="#35D073"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
</svg>
